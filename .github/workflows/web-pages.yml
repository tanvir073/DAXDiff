# Builds DAXDiff web (src/DaxDiff.Web) and deploys it to this repository's GitHub Pages site
# (https://<owner>.github.io/<repo>/). Only the compiled static site is served.
#
# One-time setup (docs/dev/web-deployment.md): Settings -> Pages -> Source: GitHub Actions.
#   - Optional variable DAXDIFF_CLIENT_ID: Entra ID client ID baked into appsettings.json (not a secret)
#   - Optional variable PAGES_BASE_PATH: defaults to /<repository name>/ ; use / for a custom domain
name: Web (GitHub Pages)

on:
  push:
    branches: [main, dev]
    paths:
      - "src/DaxDiff.Web/**"
      - "src/DaxDiff.Application/**"
      - "src/DaxDiff.Comparison/**"
      - "src/DaxDiff.Connectors.Core/**"
      - "src/DaxDiff.Domain/**"
      - "src/DaxDiff.Export/**"
      - "Directory.Build.props"
      - ".github/workflows/web-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/DaxDiff.Tests.Unit -c Release

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish src/DaxDiff.Web/DaxDiff.Web.csproj -c Release -o out

      - name: Prepare for GitHub Pages
        working-directory: out/wwwroot
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          BASE_PATH: ${{ vars.PAGES_BASE_PATH }}
          CLIENT_ID: ${{ vars.DAXDIFF_CLIENT_ID }}
        run: |
          base="${BASE_PATH:-/${REPOSITORY_NAME}/}"
          sed -i "s#<base href=\"/\" />#<base href=\"${base}\" />#" index.html
          if [ -n "$CLIENT_ID" ]; then
            jq --arg id "$CLIENT_ID" '.Auth.ClientId = $id' appsettings.json > appsettings.tmp && mv appsettings.tmp appsettings.json
          fi
          # Pages compresses on the fly and ignores precompressed files, which would now be stale anyway.
          find . -name '*.br' -delete
          find . -name '*.gz' -delete
          # Deep links (e.g. /results) load the app; Jekyll must not hide _framework.
          cp index.html 404.html
          touch .nojekyll
          grep -o '<base href="[^"]*"' index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/wwwroot

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
