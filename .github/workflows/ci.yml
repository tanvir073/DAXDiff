# Builds the whole solution and runs the unit tests on every pull request and on pushes to the long-lived branches.
name: CI

on:
  pull_request:
  push:
    branches: [main, ppe, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # The WPF desktop app only builds on Windows; everything else, tests included, must also work on macOS and Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build (whole solution)
        if: runner.os == 'Windows'
        run: dotnet build DaxDiff.sln -c Release
      - name: Build (cross-platform projects)
        if: runner.os != 'Windows'
        run: |
          dotnet build tests/DaxDiff.Tests.Unit -c Release
          dotnet build src/DaxDiff.Web/DaxDiff.Web.csproj -c Release
      - run: dotnet test tests/DaxDiff.Tests.Unit -c Release --no-build --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
