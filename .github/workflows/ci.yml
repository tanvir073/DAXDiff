# Builds the whole solution and runs the unit tests on every pull request and on pushes to the long-lived branches.
name: CI

on:
  pull_request:
  push:
    branches: [main, ppe, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # Desktop (WPF) and the Windows connectors only build on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build DaxDiff.sln -c Release
      - run: dotnet test tests/DaxDiff.Tests.Unit -c Release --no-build --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

  web:
    # The web app and the projects it shares must keep building without Windows.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/DaxDiff.Web/DaxDiff.Web.csproj -c Release
