# Builds the whole solution and runs the unit tests on every pull request and on pushes to the long-lived branches.
name: CI

on:
  pull_request:
  push:
    branches: [main, ppe, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # Everything, the desktop app and the tests included, must build and pass on Windows, macOS and Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build DaxDiff.sln -c Release
      - run: dotnet test tests/DaxDiff.Tests.Unit -c Release --no-build --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults

  package:
    # Pull requests also build the Windows, macOS and Linux downloads, so packaging breaks are caught before a release and
    # reviewers can try the change (artifacts are kept for a week).
    if: github.event_name == 'pull_request'
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest }
          - { rid: osx-arm64, os: macos-latest }
          - { rid: linux-x64, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package.ps1
      - if: runner.os != 'Windows'
        run: bash scripts/package-app.sh ${{ matrix.rid }}
      - uses: actions/upload-artifact@v7
        with:
          name: preview-${{ matrix.rid }}
          retention-days: 7
          path: |
            dist/*.msi
            dist/*.zip
            dist/*.dmg
            dist/*.tar.gz
