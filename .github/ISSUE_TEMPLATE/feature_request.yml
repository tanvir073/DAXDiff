name: Feature request
description: Suggest an improvement or a new capability.
title: "[Feature]: "
labels: [enhancement, "needs triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task or the problem, not only the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would help?
    validations:
      required: true

  - type: dropdown
    id: edition
    attributes:
      label: Which app?
      multiple: true
      options:
        - Desktop
        - Web
        - Both

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you have tried
